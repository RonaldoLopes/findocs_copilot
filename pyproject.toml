[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "findocs"
version = "0.1.0"
description = "FinDocs Copilot: dados financeiros públicos + SQL Server + MongoDB + API + LLMs"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyodbc>=5.1",
    "pymongo>=4.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
findocs = ["llm/prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unit: testes rápidos, sem bancos nem rede",
    "integration: exigem SQL Server e MongoDB no ar",
]
